<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monster Brawl (Blooket Style)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { margin: 0; background: #1b2819; color: #fff; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    .hud { width: 800px; background: #222; padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 3px solid #ff7518; font-weight: bold; }
    .xp-container { width: 800px; height: 16px; background: #333; border-bottom: 2px solid #000; }
    .xp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff, #3a7bd5); transition: width 0.15s; }
    canvas { background: #2c4228; border: 4px solid #141f12; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: block; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    .hidden { display: none !important; }
    .upgrade-cards { display: flex; gap: 20px; margin-top: 20px; }
    .card { background: #2b2338; border: 3px solid #ff7518; border-radius: 15px; width: 210px; padding: 20px; text-align: center; cursor: pointer; transition: 0.15s; }
    .card:hover { transform: translateY(-8px) scale(1.04); background: #3d3150; }
    .card-icon { font-size: 3.5rem; margin-bottom: 10px; }
    .card-title { font-size: 1.2rem; font-weight: bold; color: #ffd700; margin-bottom: 8px; }
    .card-desc { font-size: 0.9rem; color: #ddd; }
    button { background: #ff7518; color: #111; border: none; padding: 14px 28px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    button:hover { background: #ff944d; }
  </style>
</head>
<body>
  <div class="hud">
    <div>🎃 LVL <span id="lvl-text">1</span></div>
    <div>❤️ HP: <span id="hp-text">100</span>/<span id="max-hp-text">100</span></div>
    <div>⏱️ Time: <span id="time-text">0</span>s</div>
    <div style="color:#98fb98;">🌱 Pepitas: <span id="pepita-text">0</span></div>
    <div style="color:#ffd700;">🏆 Gourds: <span id="gourd-text">0</span></div>
  </div>
  <div class="xp-container"><div class="xp-bar" id="xp-bar"></div></div>
  <canvas id="gameCanvas" width="800" height="540"></canvas>

  <div id="levelup-screen" class="overlay hidden">
    <h1 style="color:#ff7518; font-size:2.5rem; margin:0;">⬆️ LEVEL UP! ⬆️</h1>
    <p style="font-size:1.1rem; color:#ccc;">Choose an ability upgrade:</p>
    <div class="upgrade-cards" id="card-container"></div>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1 style="color:#ff5555; font-size:3rem; margin:0;">💀 OVERRUN! 💀</h1>
    <p id="final-stats" style="font-size:1.3rem; margin:15px 0;"></p>
    <button onclick="location.reload()">🔄 Play Again</button>
  </div>
  <script>
    const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
    let paused = false, gameOver = false, seconds = 0, pepitas = 0, gourds = 0, spawnTimer = 0;
    let monsters = [], bullets = [], gems = [];
    const keys = {};

    const player = {
      x: 400, y: 270, radius: 18, speed: 3.3, hp: 100, maxHp: 100,
      xp: 0, maxXp: 30, level: 1, fireRate: 45, fireTimer: 0,
      bulletDmg: 18, bulletCount: 1, magnetRange: 75, orbitals: 0, orbitalAngle: 0
    };

    const upgradePool = [
      { id: "dmg", icon: "🔥", title: "Pumpkin Spice Blast", desc: "+10 Projectile Damage" },
      { id: "rate", icon: "⚡", title: "Rapid Seeds", desc: "Shoot 20% faster" },
      { id: "multi", icon: "🔱", title: "Multi-Shot", desc: "+1 Extra Projectile" },
      { id: "orbit", icon: "🎃", title: "Orbiting Lantern", desc: "Adds a spinning fireball" },
      { id: "speed", icon: "👟", title: "Vine Boots", desc: "+15% Movement Speed" },
      { id: "magnet", icon: "🧲", title: "Seed Magnet", desc: "+50% Pickup Range" },
      { id: "heal", icon: "🧪", title: "Patch Potion", desc: "Heal 50 HP & +20 Max HP" }
    ];

    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    setInterval(() => {
      if (!paused && !gameOver) {
        seconds++;
        document.getElementById("time-text").textContent = seconds;
        if (seconds % 30 === 0) { gourds++; updateHUD(); }
      }
    }, 1000);

    function spawnMonster() {
      const side = Math.floor(Math.random() * 4);
      const x = side === 1 ? 825 : side === 3 ? -25 : Math.random() * 800;
      const y = side === 0 ? -25 : side === 2 ? 565 : Math.random() * 540;
      const diff = 1 + seconds * 0.03;
      const types = [
        { emoji: "🟢", hp: 25, speed: 1.3, xp: 10 },
        { emoji: "💀", hp: 40, speed: 1.6, xp: 15 },
        { emoji: "👻", hp: 30, speed: 2.2, xp: 18 },
        { emoji: "🧟", hp: 75, speed: 1.0, xp: 25 }
      ];
      const p = types[Math.min(types.length - 1, Math.floor(Math.random() * (1 + seconds / 15)))];
      monsters.push({ x, y, emoji: p.emoji, hp: Math.floor(p.hp * diff), maxHp: Math.floor(p.hp * diff), speed: p.speed, xp: p.xp, radius: 16 });
    }

    function triggerLevelUp() {
      paused = true;
      const container = document.getElementById("card-container");
      container.innerHTML = "";
      [...upgradePool].sort(() => 0.5 - Math.random()).slice(0, 3).forEach(upg => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div class="card-icon">${upg.icon}</div><div class="card-title">${upg.title}</div><div class="card-desc">${upg.desc}</div>`;
        card.onclick = () => applyUpgrade(upg.id);
        container.appendChild(card);
      });
      document.getElementById("levelup-screen").classList.remove("hidden");
    }

    function applyUpgrade(id) {
      if (id === "dmg") player.bulletDmg += 10;
      if (id === "rate") player.fireRate = Math.max(10, Math.floor(player.fireRate * 0.8));
      if (id === "multi") player.bulletCount += 1;
      if (id === "orbit") player.orbitals += 1;
      if (id === "speed") player.speed *= 1.15;
      if (id === "magnet") player.magnetRange *= 1.5;
      if (id === "heal") { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 50); }
      document.getElementById("levelup-screen").classList.add("hidden");
      paused = false;
      updateHUD();
    }
    function shootNearest() {
      if (!monsters.length) return;
      let nearest = monsters, minDist = Infinity;
      for (let m of monsters) {
        const d = Math.hypot(m.x - player.x, m.y - player.y);
        if (d < minDist) { minDist = d; nearest = m; }
      }
      const baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
      for (let i = 0; i < player.bulletCount; i++) {
        const angle = baseAngle + (i - (player.bulletCount - 1) / 2) * 0.18;
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7, dmg: player.bulletDmg, life: 70 });
      }
    }

    function updateHUD() {
      document.getElementById("lvl-text").textContent = player.level;
      document.getElementById("hp-text").textContent = Math.max(0, Math.ceil(player.hp));
      document.getElementById("max-hp-text").textContent = player.maxHp;
      document.getElementById("pepita-text").textContent = pepitas;
      document.getElementById("gourd-text").textContent = gourds;
      document.getElementById("xp-bar").style.width = Math.min(100, (player.xp / player.maxXp) * 100) + "%";
    }

    function update() {
      if (paused || gameOver) return;
      let dx = (keys["d"] || keys["arrowright"] ? 1 : 0) - (keys["a"] || keys["arrowleft"] ? 1 : 0);
      let dy = (keys["s"] || keys["arrowdown"] ? 1 : 0) - (keys["w"] || keys["arrowup"] ? 1 : 0);
      if (dx || dy) {
        const len = Math.hypot(dx, dy);
        player.x = Math.max(20, Math.min(780, player.x + (dx / len) * player.speed));
        player.y = Math.max(20, Math.min(520, player.y + (dy / len) * player.speed));
      }

      if (++player.fireTimer >= player.fireRate) { shootNearest(); player.fireTimer = 0; }
      if (++spawnTimer >= Math.max(18, 65 - Math.floor(seconds * 0.6))) { spawnMonster(); spawnTimer = 0; }

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i]; b.x += b.vx; b.y += b.vy;
        if (--b.life <= 0) { bullets.splice(i, 1); continue; }
        for (let j = monsters.length - 1; j >= 0; j--) {
          let m = monsters[j];
          if (Math.hypot(b.x - m.x, b.y - m.y) < m.radius + 6) {
            m.hp -= b.dmg; bullets.splice(i, 1);
            if (m.hp <= 0) { gems.push({ x: m.x, y: m.y, xp: m.xp }); monsters.splice(j, 1); }
            break;
          }
        }
      }

      player.orbitalAngle += 0.06;
      for (let o = 0; o < player.orbitals; o++) {
        const ang = player.orbitalAngle + (o * Math.PI * 2 / player.orbitals);
        const ox = player.x + Math.cos(ang) * 55, oy = player.y + Math.sin(ang) * 55;
        for (let j = monsters.length - 1; j >= 0; j--) {
          let m = monsters[j];
          if (Math.hypot(ox - m.x, oy - m.y) < m.radius + 12 && (m.hp -= 2.5) <= 0) {
            gems.push({ x: m.x, y: m.y, xp: m.xp }); monsters.splice(j, 1);
          }
        }
      }

      for (let m of monsters) {
        const ang = Math.atan2(player.y - m.y, player.x - m.x);
        m.x += Math.cos(ang) * m.speed; m.y += Math.sin(ang) * m.speed;
        if (Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
          player.hp -= 0.4; updateHUD();
          if (player.hp <= 0) {
            gameOver = true;
            document.getElementById("final-stats").textContent = `Level ${player.level} | ${seconds}s | ${pepitas} Pepitas & ${gourds} Golden Gourds!`;
            document.getElementById("gameover-screen").classList.remove("hidden");
          }
        }
      }

      for (let i = gems.length - 1; i >= 0; i--) {
        let g = gems[i], dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < player.magnetRange) {
          const ang = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(ang) * 5.5; g.y += Math.sin(ang) * 5.5;
        }
        if (dist < player.radius + 10) {
          player.xp += g.xp; pepitas += 5; gems.splice(i, 1);
          if (player.xp >= player.maxXp) { player.xp -= player.maxXp; player.level++; player.maxXp = Math.floor(player.maxXp * 1.35); triggerLevelUp(); }
          updateHUD();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = "16px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let g of gems) ctx.fillText("💎", g.x, g.y);
      ctx.fillStyle = "#ffae00";
      for (let b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill(); }
      ctx.font = "22px Arial";
      for (let o = 0; o < player.orbitals; o++) {
        const ang = player.orbitalAngle + (o * Math.PI * 2 / player.orbitals);
        ctx.fillText("🔥", player.x + Math.cos(ang) * 55, player.y + Math.sin(ang) * 55);
      }
      ctx.font = "32px Arial"; ctx.fillText("🎃", player.x, player.y);
      for (let m of monsters) {
        ctx.font = "28px Arial"; ctx.fillText(m.emoji, m.x, m.y);
        ctx.fillStyle = "#000"; ctx.fillRect(m.x - 15, m.y - 22, 30, 5);
        ctx.fillStyle = "#ff5555"; ctx.fillRect(m.x - 15, m.y - 22, 30 * (m.hp / m.maxHp), 5);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    updateHUD(); loop();
  </script>
</body>
</html>
